<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盖洛普优势测试样本</title>
  <style>
    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .report {
      background: white;
      max-width: 500px;
      width: 100%;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #5D4037;
      padding-bottom: 20px;
    }
    .header h1 {
      color: #5D4037;
      font-size: 28px;
      margin: 0 0 10px 0;
    }
    .header p {
      color: #666;
      margin: 0;
    }
    .section-title {
      color: #5D4037;
      font-size: 18px;
      font-weight: bold;
      margin: 30px 0 15px 0;
      padding-left: 10px;
      border-left: 4px solid #5D4037;
    }
    .strength-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .strength-item {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      margin: 12px 0;
      background: #f8f6f3;
      border-radius: 8px;
      font-size: 22px;
      font-weight: bold;
    }
    .rank {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: #5D4037;
      color: white;
      border-radius: 50%;
      margin-right: 15px;
      font-weight: bold;
    }
    .domains {
      display: flex;
      justify-content: space-around;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
    .domain {
      text-align: center;
      padding: 10px;
    }
    .domain-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
    }
    .domain-value {
      font-size: 20px;
      font-weight: bold;
      color: #5D4037;
    }
  </style>
</head>
<body>
  <div class="report">
    <div class="header">
      <h1>盖洛普优势评估报告</h1>
      <p>CliftonStrengths TOP 5 优势</p>
    </div>

    <div class="section-title">你的五大优势</div>
    <ul class="strength-list">
      <li class="strength-item">
        <span class="rank">1</span>
        专注
      </li>
      <li class="strength-item">
        <span class="rank">2</span>
        信仰
      </li>
      <li class="strength-item">
        <span class="rank">3</span>
        责任
      </li>
      <li class="strength-item">
        <span class="rank">4</span>
        前瞻
      </li>
      <li class="strength-item">
        <span class="rank">5</span>
        搜集
      </li>
    </ul>

    <div class="domains">
      <div class="domain">
        <div class="domain-label">执行力</div>
        <div class="domain-value">3</div>
      </div>
      <div class="domain">
        <div class="domain-label">战略思维</div>
        <div class="domain-value">2</div>
      </div>
    </div>
  </div>
</body>
</html>
